name: CI app

on:
  push:
    branches: [main]
    paths:
      - native/**
      - .github/workflows/ci-app.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - native/**
      - .github/workflows/ci-app.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Install OpenSSL for the path probe
        run: brew install openssl@4
      - name: Test Swift core
        env:
          # OpenSSLPathTests fails instead of skipping when Homebrew openssl@4 is missing.
          FVT_REQUIRE_OPENSSL_PROBE: "1"
        run: |
          set +e
          native/scripts/test.sh 2>&1 | tee "$RUNNER_TEMP/swift-tests.log"
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ]; then
            python3 - <<'PYCODE'
          import os
          from pathlib import Path
          lines = Path(os.environ["RUNNER_TEMP"]).joinpath("swift-tests.log").read_text().splitlines()[-80:]
          message = "\n".join(lines).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=Swift test failure::" + message)
          PYCODE
          fi
          exit "$result"
      - name: Build native application
        run: native/scripts/build.sh
      - name: Verify signature and archive
        run: |
          codesign --verify --deep --strict native/dist/FortiVPNTray.app
          unzip -t native/dist/FortiVPNTray-native-arm64.zip
