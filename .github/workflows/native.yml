name: Native macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Test Swift core
        run: |
          set +e
          native/scripts/test.sh 2>&1 | tee "$RUNNER_TEMP/swift-tests.log"
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ]; then
            python3 - <<'PYCODE'
          import os
          from pathlib import Path
          lines = Path(os.environ["RUNNER_TEMP"]).joinpath("swift-tests.log").read_text().splitlines()[-80:]
          message = "\n".join(lines).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=Swift test failure::" + message)
          PYCODE
          fi
          exit "$result"
      - name: Test connection helper
        run: cargo test --manifest-path helper/Cargo.toml --locked
      - name: Build native application
        run: native/scripts/build.sh
      - name: Verify signature and archive
        run: |
          codesign --verify --deep --strict native/dist/FortiVPNTray.app
          unzip -t native/dist/FortiVPNTray-native-arm64.zip
